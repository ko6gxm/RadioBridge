name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (PyInstaller)
        run: |
          pyinstaller --clean --onefile -n rb -p src src/radiobridge/cli.py
          ls -lh dist

      - name: Rename artifact with arch
        run: |
          mv dist/rb dist/rb-macos-${{ matrix.arch }}

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rb-macos-${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (PyInstaller)
        run: |
          pyinstaller --clean --onefile -n rb -p src src/radiobridge/cli.py
          ls -lh dist

      - name: Rename artifact
        run: |
          mv dist/rb dist/rb-linux-x86_64

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rb-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build binary (PyInstaller)
        run: |
          pyinstaller --clean --onefile -n rb -p src src\radiobridge\cli.py
          dir dist

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item dist\rb.exe dist\rb-windows-x86_64.exe

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rb-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

